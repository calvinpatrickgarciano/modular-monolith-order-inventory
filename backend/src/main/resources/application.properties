spring.application.name=backend

# ==================================================
# DATABASE / SUPABASE
# ==================================================

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}

# Keep the local Hikari pool small because the
# Supabase session-mode pool only allows a limited
# number of client connections.
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=120000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

server.port=8080

# ==================================================
# INVENTORY
# ==================================================

inventory.low-stock-threshold=5

# ==================================================
# LEGACYSUPPLY / LAB 3
# ==================================================

supplier.base-url=https://legacysupply.onrender.com/api/v1
supplier.client-id=${LS_CLIENT_ID}
supplier.api-key=${LS_API_KEY}

supplier.retry-delay-ms=60000
supplier.tracking-delay-ms=60000

# ==================================================
# TIANGGE / LAB 4
# ==================================================

channel.tiangge.base-url=https://legacysupply.onrender.com/tiangge/v1

channel.tiangge.client-id=${LS_CLIENT_ID}
channel.tiangge.api-key=${LS_API_KEY}

channel.tiangge.app-name=garciano-shop

channel.tiangge.heartbeat-ms=30000

channel.tiangge.feed-poll-ms=1000
channel.tiangge.feed-initial-delay-ms=1000
channel.tiangge.stock-retry-ms=1000
channel.tiangge.backorder-retry-ms=10000

# Allow scheduled Lab 3 / Lab 4 jobs to run independently.
# Database concurrency is separately limited by Hikari above.
spring.task.scheduling.pool.size=6